<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblyx — Reset Your Password</title>
<style>
  :root{
    --bg:#f7f6f2; --ink:#1e242c; --dim:#5a6270; --rule:#dcdcd2; --accent:#2b4a6f;
    --error:#b3261e; --field-bg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181d; --ink:#e8e6df; --dim:#a3aab3; --rule:#2b323b; --accent:#8fb1d6; --field-bg:#1c2128; }
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; line-height:1.6;
  }
  .wrap{max-width:420px; margin:0 auto; padding:64px 20px 80px;}
  h1{font-size:24px; margin-bottom:8px;}
  p{font-size:15px; color:var(--dim);}
  label{display:block; font-size:13px; font-weight:600; margin:20px 0 6px;}
  input{
    width:100%; padding:12px 14px; font-size:15px; border-radius:8px;
    border:1px solid var(--rule); background:var(--field-bg); color:var(--ink);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{
    width:100%; margin-top:24px; padding:13px; font-size:15px; font-weight:600;
    border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:.5; cursor:default;}
  .msg{margin-top:16px; font-size:14px; padding:12px 14px; border-radius:8px; display:none;}
  .msg.error{background:rgba(179,38,30,0.1); color:var(--error); display:block;}
  .msg.success{background:rgba(43,74,111,0.1); color:var(--accent); display:block;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <h1>Reset Your Password</h1>
  <p id="intro">Enter a new password for your Biblyx account.</p>

  <form id="resetForm">
    <label for="password">New password</label>
    <input type="password" id="password" minlength="6" required autocomplete="new-password">

    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" minlength="6" required autocomplete="new-password">

    <button type="submit" id="submitBtn">Set new password</button>
  </form>

  <div id="msg" class="msg"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // The publishable/anon key is safe to embed client-side by design — same
  // trust level as it already has inside the compiled Biblyx app.
  const SUPABASE_URL = 'https://lmdpsvazlkpqlueplojf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VnkqbtXw0zPKUxchgTHSWQ_mo9zou1N';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('submitBtn');
  const msgEl = document.getElementById('msg');
  const intro = document.getElementById('intro');

  function showMessage(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  // Supabase's recovery link lands here with the session tokens in the URL
  // hash (#access_token=...&refresh_token=...&type=recovery) rather than a
  // query string — supabase-js's detectSessionInUrl (on by default) picks
  // this up automatically on client creation and fires SIGNED_IN, so we
  // just wait for that instead of parsing the hash ourselves.
  let sessionReady = false;
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      sessionReady = true;
    }
  });

  // If detectSessionInUrl already resolved before the listener above
  // attached, there's no separate recovery event to catch — check directly.
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) sessionReady = true;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password.length < 6) {
      showMessage('Password must be at least 6 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }
    if (!sessionReady) {
      showMessage('This reset link is invalid or has expired. Request a new one from the app.', 'error');
      return;
    }

    submitBtn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password });
    submitBtn.disabled = false;

    if (error) {
      showMessage(error.message, 'error');
      return;
    }

    form.classList.add('hidden');
    intro.textContent = '';
    showMessage('Your password has been changed. You can now sign in with it in the Biblyx app.', 'success');
  });
</script>

</body>
</html>
